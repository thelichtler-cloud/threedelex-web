<title>Briefbox · Snapmaker U1 · ABS · Slice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#14181d;--card:#1c2128;--line:#2e3540;--fg:#eef1f4;--mut:#8d98a5;--acc:#ff8a3d;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 "Inter",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 340px;height:100dvh}
#view{position:relative;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#kopf{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
#kopf h1{margin:0;font-size:24px;text-wrap:balance}
#kopf p{margin:2px 0 0;color:var(--mut)}
#unten{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
#leg{display:flex;flex-wrap:wrap;gap:6px}
#leg button{display:flex;align-items:center;gap:6px;background:rgba(28,33,40,.85);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
#leg button i{width:14px;height:4px;border-radius:2px;display:block}
#leg button.aus{opacity:.35}
#modus{display:inline-flex;background:rgba(28,33,40,.85);border:1px solid var(--line);border-radius:999px;padding:2px;align-self:flex-start}
#modus button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:4px 12px;border-radius:999px;cursor:pointer}
#modus button.an{background:var(--line);color:var(--fg)}
#fil{display:grid;gap:8px;margin-bottom:16px}
#fil div{display:flex;align-items:center;gap:10px}
#fil i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
#fil b{font-weight:600}
#fil span{color:var(--mut);margin-left:auto;font-variant-numeric:tabular-nums}
.reg{display:flex;align-items:center;gap:10px;background:rgba(28,33,40,.85);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.reg input{flex:1;accent-color:var(--acc);min-width:0}
.reg span{font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap;font-size:12px}
.reg button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
#karte{background:var(--card);overflow:auto;padding-block:20px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px))}
#karte dl{margin:0;display:grid;gap:10px}
#karte dt{color:var(--mut);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
#karte dd{margin:1px 0 0;font-weight:600}
#karte dd.gross{font-size:22px}
#karte hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#hilfe{color:var(--mut);font-size:12px;margin-top:16px}
#anhang{max-width:1100px;margin:0 auto;padding-block:36px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
#anhang h2{margin:0;font-size:22px;text-wrap:balance}#anhang h3{margin:0;font-size:16px}
#anhang p{margin:0;color:var(--mut);max-width:72ch}
#anhang .bilder{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
#anhang figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;min-width:0}
#anhang figure img{display:block;width:100%;height:auto;background:#e9edf1}
#anhang figcaption{padding:10px 12px 12px;display:grid;gap:6px;font-size:13px;color:var(--mut)}
#anhang figcaption b{color:var(--fg)}
#anhang .skala{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:11px;font-variant-numeric:tabular-nums}
#anhang .skala i{height:7px;border-radius:2px;background:linear-gradient(90deg,#1b3fae,#1f8fd6,#2fc4a6,#9ad640,#f2d02b,#ef7d1f,#d42a1f)}
#anhang .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
#anhang table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
#anhang th,#anhang td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
#anhang th{color:var(--mut);font-weight:600}#anhang td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#anhang .vgl{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
#anhang .vgl .buehne{position:relative;overflow:hidden;border-radius:6px;background:#e9edf1;touch-action:pan-y;cursor:ew-resize;aspect-ratio:3/2;max-width:100%}
#anhang .vgl .buehne img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
#anhang .vgl .oben{clip-path:inset(0 0 0 50%)}
#anhang .vgl .strich{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);left:50%;transform:translateX(-1px);pointer-events:none}
#anhang .vgl .strich::after{content:"\2194";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--acc);color:#14181d;border-radius:999px;width:28px;height:28px;display:grid;place-items:center;font-size:15px;font-weight:700}
#anhang .vgl .marke{position:absolute;top:8px;background:rgba(20,24,29,.82);color:#eef1f4;font-size:12px;padding:3px 8px;border-radius:999px;pointer-events:none}
#anhang .vgl .marke.l{left:8px}#anhang .vgl .marke.r{right:8px}
#anhang .vgl .wahl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
#anhang .vgl select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
#anhang .vgl input[type=range]{width:100%;accent-color:var(--acc)}
#anhang .vgls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
body.mit-anhang{overflow:auto}#zumanhang{display:none;color:var(--acc);font-size:13px;margin-top:14px;text-decoration:none}body.mit-anhang #zumanhang{display:block}
@media (max-width:760px){
 body{overflow:auto}
 #app{grid-template-columns:1fr;grid-template-rows:72dvh auto;height:auto}
 #kopf h1{font-size:19px}
}
</style>

 <div id="view">

   <div id="modus"><button data-m="f" class="an">Filamentfarbe</button><button data-m="t">Bahnart</button></div>

</div>
